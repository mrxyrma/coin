name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Кнопка «Run workflow» во вкладке Actions — для ручного передеплоя
  workflow_dispatch:

# Токен на запись в Pages выдаётся самому workflow, секреты не нужны
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: побеждает последний пуш.
# cancel-in-progress: false — начатую выкладку не рвём на середине.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Проверки те же, что локально: сломанная сборка не должна уехать в прод
      - run: npm run lint
      - run: npm test

      - run: npm run build
        env:
          # Сайт отдаётся из подкаталога с именем репозитория
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
